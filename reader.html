
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baca Manga - MangaZone</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101018;
      color: #f5f3ff;
      font-family: Arial, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 14px;
      background: #191925;
      border-bottom: 1px solid #303044;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    header a {
      color: #c4b5fd;
      text-decoration: none;
    }

    h1 {
      font-size: 18px;
      margin: 0;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 18px 12px 35px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }

    select, button {
      border: 0;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
    }

    select {
      background: #272738;
      color: white;
      min-width: 0;
    }

    button {
      background: #a78bfa;
      color: #171324;
      font-weight: bold;
      cursor: pointer;
    }

    .chapter-title {
      text-align: center;
      margin: 24px 0;
    }

    .chapter-title p {
      color: #aaa7bc;
      font-size: 14px;
    }

    .page {
      width: 100%;
      display: block;
      margin: 0 auto;
      min-height: 260px;
      object-fit: contain;
      background: #242434;
    }

    .placeholder {
      min-height: 260px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 28px;
      margin-bottom: 5px;
      background: #242434;
      color: #c4b5fd;
      line-height: 1.7;
    }

    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 22px;
    }

    footer {
      text-align: center;
      color: #aaa7bc;
      padding: 24px 12px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <a href="./index.html">← Katalog</a>
    <h1>MangaZone</h1>
  </header>

  <main>
    <div class="toolbar">
      <select id="chapter" aria-label="Pilih chapter">
        <option value="1">Chapter 1</option>
        <option value="2">Chapter 2</option>
        <option value="3">Chapter 3</option>
      </select>

      <button id="topButton">Ke atas ↑</button>
    </div>

    <div class="chapter-title">
      <h2 id="title">Shadow Legend</h2>
      <p id="chapterLabel">Chapter 1</p>
    </div>

    <section id="pages" aria-label="Halaman manga">
  <img class="page"
       src="./images/chapter-1/001.webp"
       alt="Halaman 1 manga">

  <img class="page"
       src="./images/chapter-1/002.webp"
       alt="Halaman 2 manga">

  <img class="page"
       src="./images/chapter-1/003.webp"
       alt="Halaman 3 manga">
</section>

    <div class="navigation">
      <button id="previous">← Sebelumnya</button>
      <button id="next">Berikutnya →</button>
    </div>
  </main>

  <footer>
    MangaZone — Pembaca manga
  </footer>

  <script>
    const chapter = document.getElementById("chapter");
    const label = document.getElementById("chapterLabel");
    const pages = document.getElementById("pages");

pages.innerHTML = `
  <img src="./images/chapter-1/001.webp" alt="Halaman 1">
  <img src="./images/chapter-1/002.webp" alt="Halaman 2">
  <img src="./images/chapter-1/003.webp" alt="Halaman 3">
`;
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");

    function updateChapter() {
      const number = Number(chapter.value);

      label.textContent = "Chapter " + number;
      document.title = "Shadow Legend - Chapter " + number;

      // Gambar chapter akan ditambahkan nanti.
      pages.innerHTML = `
        <div class="placeholder">
          Shadow Legend<br>
          Chapter ${number}<br>
          Gambar chapter akan ditambahkan pada langkah berikutnya.
        </div>
        <div class="placeholder">
          Halaman 2 — Chapter ${number}
        </div>
        <div class="placeholder">
          Halaman 3 — Chapter ${number}
        </div>
      `;

      previous.disabled = number === 1;
      next.disabled = number === 3;

      previous.style.opacity = previous.disabled ? ".4" : "1";
      next.style.opacity = next.disabled ? ".4" : "1";
    }

    chapter.addEventListener("change", updateChapter);

    previous.addEventListener("click", () => {
      if (Number(chapter.value) > 1) {
        chapter.value = String(Number(chapter.value) - 1);
        updateChapter();
        window.scrollTo(0, 0);
      }
    });

    next.addEventListener("click", () => {
      if (Number(chapter.value) < 3) {
        chapter.value = String(Number(chapter.value) + 1);
        updateChapter();
        window.scrollTo(0, 0);
      }
    });

    document.getElementById("topButton").addEventListener(
      "click", () => window.scrollTo({
        top: 0,
        behavior: "smooth"
      })
    );

    updateChapter();
  </script>
</body>
</html>
