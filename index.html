
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101018">
  <title>MangaZone — Baca Manga</title>
  <style>
    :root {
      --bg: #101018;
      --panel: #1b1b27;
      --text: #f6f4ff;
      --muted: #a7a5b8;
      --accent: #a78bfa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: #171722;
      border-bottom: 1px solid #292938;
    }

    .logo { font-size: 24px; font-weight: bold; }
    .logo span { color: var(--accent); }

    input, select {
      background: var(--panel);
      color: white;
      border: 1px solid #39394b;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
    }

    #search { width: min(100%, 280px); }

    main { padding: 28px 6%; }

    .hero {
      padding: 32px;
      border-radius: 16px;
      background: linear-gradient(120deg, #30234d, #171722);
      margin-bottom: 30px;
    }

    .hero h1 { margin-top: 0; font-size: 32px; }
    .hero p { color: #d0c8e9; line-height: 1.6; }

    .section-title { margin-bottom: 18px; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fill, minmax(145px, 1fr)
      );
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #292938;
      transition: transform .2s;
    }

    .card:hover { transform: translateY(-4px); }

    .cover {
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(145deg, var(--c1), var(--c2));
      color: white;
    }

    .info { padding: 12px; }
    .info h3 { margin: 0 0 8px; font-size: 16px; }
    .info p { margin: 5px 0; color: var(--muted); font-size: 13px; }
    .tag { color: var(--accent) !important; }

    .empty { color: var(--muted); padding: 20px 0; }

    .modal {
      position: fixed;
      inset: 0;
      padding: 20px;
      background: #000b;
      display: none;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      z-index: 10;
    }

    .modal.open { display: flex; }

    .modal-content {
      width: min(100%, 540px);
      background: #1b1b27;
      padding: 24px;
      border-radius: 16px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-cover {
      padding: 25px;
      text-align: center;
      border-radius: 10px;
      font-size: 27px;
      font-weight: bold;
      background: linear-gradient(145deg, var(--c1), var(--c2));
    }

    button {
      padding: 10px 14px;
      background: var(--accent);
      color: #171324;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .close { float: right; margin-bottom: 15px; }
    .chapters { display: grid; gap: 9px; }
    .chapter {
      background: #292938;
      color: white;
      text-align: left;
      width: 100%;
    }

    footer {
      text-align: center;
      padding: 28px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 480px) {
      header { padding: 16px 5%; }
      main { padding: 22px 5%; }
      .hero { padding: 23px; }
      .hero h1 { font-size: 26px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cover { height: 190px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Manga<span>Zone</span></div>
    <input id="search" type="search"
      placeholder="Cari judul manga..."
      aria-label="Cari manga">
  </header>

  <main>
    <section class="hero">
      <h1>Jelajahi Dunia Manga</h1>
      <p>
        Temukan cerita favoritmu, jelajahi berbagai genre,
        dan lanjutkan membaca chapter pilihanmu.
      </p>
      <button onclick="showAll()">Jelajahi Manga</button>
    </section>

    <h2 class="section-title" id="catalog">Katalog Manga</h2>

    <div class="toolbar">
      <select id="genre" aria-label="Filter genre">
        <option value="">Semua genre</option>
        <option value="Action">Action</option>
        <option value="Fantasy">Fantasy</option>
        <option value="Adventure">Adventure</option>
        <option value="Comedy">Comedy</option>
      </select>
      <select id="sort" aria-label="Urutkan manga">
        <option value="default">Urutan awal</option>
        <option value="az">Judul A–Z</option>
      </select>
    </div>

    <div id="manga-list" class="grid"></div>
    <p id="empty" class="empty" hidden>
      Manga tidak ditemukan. Coba kata kunci lain.
    </p>
  </main>

  <div id="modal" class="modal" role="dialog"
    aria-modal="true" aria-labelledby="detail-title"
    onclick="if(event.target===this) closeDetail()">
    <div class="modal-content">
      <button class="close" onclick="closeDetail()">Tutup ✕</button>
      <div id="detail-cover" class="modal-cover"></div>
      <h2 id="detail-title"></h2>
      <p id="detail-genre" class="tag"></p>
      <p id="detail-description"></p>
      <h3>Daftar Chapter</h3>
      <div id="chapter-list" class="chapters"></div>
    </div>
  </div>

  <footer>
    MangaZone — Website katalog manga untuk belajar web development.
  </footer>

  <script>
    // Data contoh. Ganti dengan manga milikmu sendiri.
    const manga = [
      {
        id: 1,
        title: "Shadow Legend",
        genre: "Action",
        status: "Ongoing",
        chapters: 12,
        c1: "#51326e",
        c2: "#15152d",
        description: "Seorang petualang memulai perjalanan misterius.",
      },
      {
        id: 2,
        title: "Dragon Kingdom",
        genre: "Fantasy",
        status: "Ongoing",
        chapters: 8,
        c1: "#a24a32",
        c2: "#382041",
        description: "Petualangan di kerajaan yang dihuni naga.",
      },
      {
        id: 3,
        title: "Star Voyager",
        genre: "Adventure",
        status: "Completed",
        chapters: 20,
        c1: "#245b80",
        c2: "#252047",
        description: "Ekspedisi menjelajahi galaksi yang luas.",
      },
      {
        id: 4,
        title: "Funny Days",
        genre: "Comedy",
        status: "Ongoing",
        chapters: 15,
        c1: "#b16b35",
        c2: "#612b56",
        description: "Kisah keseharian penuh kejadian lucu.",
      },
      {
        id: 5,
        title: "Crimson Blade",
        genre: "Action",
        status: "Ongoing",
        chapters: 10,
        c1: "#9c293d",
        c2: "#291b37",
        description: "Seorang pendekar mencari jati dirinya.",
      },
      {
        id: 6,
        title: "Magic Academy",
        genre: "Fantasy",
        status: "Completed",
        chapters: 18,
        c1: "#286a67",
        c2: "#30234d",
        description: "Murid baru belajar sihir di sebuah akademi.",
      }
    ];

    const list = document.getElementById("manga-list");
    const search = document.getElementById("search");
    const genre = document.getElementById("genre");
    const sort = document.getElementById("sort");

    function renderManga() {
      let data = manga.filter(item => {
        const matchTitle = item.title.toLowerCase()
          .includes(search.value.toLowerCase());
        const matchGenre = !genre.value ||
          item.genre === genre.value;
        return matchTitle && matchGenre;
      });

      if (sort.value === "az") {
        data.sort((a, b) => a.title.localeCompare(b.title));
      }

      list.innerHTML = data.map(item => `
        <article class="card" tabindex="0"
          role="button" aria-label="Detail ${item.title}"
          onclick="openDetail(${item.id})"
          onkeydown="if(event.key==='Enter'||event.key===' '){
            event.preventDefault(); openDetail(${item.id})
          }">
          <div class="cover"
            style="--c1:${item.c1};--c2:${item.c2}">
            ${item.title}
          </div>
          <div class="info">
            <h3>${item.title}</h3>
            <p class="tag">${item.genre}</p>
            <p>${item.status}</p>
            <p>${item.chapters} chapter</p>
          </div>
        </article>
      `).join("");

      document.getElementById("empty").hidden = data.length > 0;
    }

    function openDetail(id) {
      const item = manga.find(m => m.id === id);
      if (!item) return;

      const cover = document.getElementById("detail-cover");
      cover.textContent = item.title;
      cover.style.setProperty("--c1", item.c1);
      cover.style.setProperty("--c2", item.c2);

      document.getElementById("detail-title").textContent = item.title;
      document.getElementById("detail-genre").textContent =
        item.genre + " • " + item.status;
      document.getElementById("detail-description").textContent =
        item.description;

      const chapters = document.getElementById("chapter-list");
      chapters.replaceChildren();

      for (let i = item.chapters; i >= 1; i--) {
        const button = document.createElement("button");
        button.className = "chapter";
        button.textContent = "Chapter " + i;
        button.onclick = () => readChapter(item, i);
        chapters.appendChild(button);
      }

      document.getElementById("modal").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeDetail() {
      document.getElementById("modal").classList.remove("open");
      document.body.style.overflow = "";
    }

    function readChapter(item, number) {
      alert(
        "Kamu memilih " + item.title + " — Chapter " + number +
        ". Halaman baca akan dibuat pada tahap berikutnya."
      );
    }

    function showAll() {
      search.value = "";
      genre.value = "";
      sort.value = "default";
      renderManga();
      document.getElementById("catalog").scrollIntoView({
        behavior: "smooth"
      });
    }

    search.addEventListener("input", renderManga);
    genre.addEventListener("change", renderManga);
    sort.addEventListener("change", renderManga);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeDetail();
    });

    renderManga();
  </script>
</body>
</html>
